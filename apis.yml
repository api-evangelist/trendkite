name: TrendKite
description: TrendKite was an Austin, Texas PR and media intelligence platform founded in 2013 that used
  AI and big-data analytics to measure the impact of earned media on brand reputation, website traffic, and
  business goals. It was acquired by Cision in January 2019 for approximately $225 million and folded into
  the Cision Communications Cloud. TrendKite no longer operates as an independent company. Its former domain
  (trendkite.com) now redirects to cision.com, and no independent TrendKite developer portal, public API,
  OpenAPI specification, SDKs, or /.well-known discovery surface exists. This profile is retained as a
  historical portfolio-company record; there is no standalone API surface to enrich.
